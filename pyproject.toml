[project]
name = "release-notes-engine"
version = "0.1.0"
description = "Release Notes Engine v0 — generate a five-heading Chinese changelog for end users."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
release-notes-engine = "release_notes_engine.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["release_notes_engine*"]
